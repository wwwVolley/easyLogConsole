org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true

kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Kotlin 编译链（与宿主工程保持一致，勿随意改动） ---
# AGP 9 默认启用内置 Kotlin（版本随 AGP 固定），本项目依赖栈以更新版本的
# Kotlin 编译，内置编译器读它的 metadata 会报 incompatible version of Kotlin。
# 因此关闭内置 Kotlin，改用 org.jetbrains.kotlin.android 显式锁定版本；
# 该插件不支持 AGP 9 的新 DSL，需同时关闭 newDsl。
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
